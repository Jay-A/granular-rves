[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granular-rves"
version = "0.1.0"
description = "Three-dimensional computational mechanics of realistic granular microstructures using FEniCSx."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jay M. Appleton" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
