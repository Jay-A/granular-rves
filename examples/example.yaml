name: example

analysis:
  type: steady

geometry:
  type: cylinder
  x0: [0.0, 0.0, 0.0]
  x1: [0.0, 0.0, 1.0]
  radius: 1.0

mesh:
  size: 0.25

mechanics:
  kinematics:
    small_strain: {}

  constitutive:
    linear_elastic:
      youngs_modulus: 1.0e6
      poisson_ratio: 0.3

  balance:
    momentum: {}

boundary:
  bottom:
    face: bottom

  top:
    face: top

  lateral:
    face: lateral

  dirichlet:
    bottom:
      component: z
      value: 0.0

    top:
      component: z

constraints:
  reference_boundary: bottom

  rigid_body:
    translation:
      x: mean_zero
      y: mean_zero

    rotation:
      z: mean_zero

loading:
  type: displacement
  boundary: top
  component: z
  value: -0.01

output:
  directory: output/example


