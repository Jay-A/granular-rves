name: example

analysis:
  type: quasi_static

geometry:
  type: cylinder
  x0: [0.0, 0.0, 0.0]
  x1: [0.0, 0.0, 1.0]
  radius: 1.0

mesh:
  size: 0.25

mechanics:

  kinematics:
    small_strain: {}

  constitutive:
    linear_elastic:
      youngs_modulus: 1.0e6
      poisson_ratio: 0.3

  balance:
    momentum: {}

  boundary:
    dirichlet:
      bottom:
        component: z
        value: 0.0
      top:
        component: z

loading:
  type: displacement
  region: top
  component: z
  start: 0.0
  end: -0.01
  steps: 10

output:
  directory: output/example
