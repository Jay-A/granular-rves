name: Build and deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'ci: publish generated report artifacts')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            sphinx \
            myst-parser \
            pydata-sphinx-theme

      - name: Run tests
        run: |
          mkdir -p _build
          python -m pytest --junitxml=_build/pytest.xml

      - name: Generate build metadata
        run: |
          python -m scripts.generate_build_info \
            --pytest-xml _build/pytest.xml

      - name: Populate LaTeX report fields
        run: |
          python -m scripts.populate_report_fields

      - name: Prepare LaTeX report
        run: |
          cp docs/report/references.bib _build/report/references.bib

      - name: Build LaTeX report
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          run: |
            cd _build/report
            latexmk \
              -pdf \
              -file-line-error \
              -halt-on-error \
              -interaction=nonstopmode \
              main.tex

      - name: Publish report PDF
        run: |
          mkdir -p report
          cp _build/report/main.pdf \
            report/granular-rves-report.pdf

      - name: Build Sphinx documentation
        run: |
          sphinx-build -b html docs _build/html

      - name: Add PDF to documentation
        run: |
          mkdir -p _build/html/pdf
          cp _build/report/main.pdf \
            _build/html/pdf/granular-rves-report.pdf

      - name: Publish generated report artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build_info.json report/granular-rves-report.pdf

          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
            exit 0
          fi

          git commit -m "ci: publish generated report artifacts"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
